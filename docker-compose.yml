version: '3.8'

services:
  computer-vision:
    build:
      context: .
      dockerfile: Dockerfile
    image: jetson-cv:latest
    container_name: jetson-computer-vision
    
    # GPU access
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      
      # Model configuration
      - MODEL_NAME=yolov8n
      - CONFIDENCE=0.25
      - IOU_THRESHOLD=0.45
      
      # Video source (0=webcam, rtsp://url, /videos/file.mp4)
      - VIDEO_SOURCE=0
      - RESOLUTION=1920x1080
      - FPS=30
      
      # Performance
      - USE_TENSORRT=true
      - USE_FP16=true
      - BATCH_SIZE=1
      
      # Output
      - SAVE_RESULTS=false
      - OUTPUT_DIR=/output
    
    # Port mapping
    ports:
      - "8080:8080"
    
    # Device access for camera
    devices:
      - /dev/video0:/dev/video0
    
    # Volumes
    volumes:
      - ./models:/models
      - ./output:/output
      - ./videos:/videos
      - ./config.yaml:/app/config.yaml
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network
    network_mode: "host"

